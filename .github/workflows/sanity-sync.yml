name: Sync content from Sanity

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: write

concurrency:
  group: sanity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull content from Sanity into the HTML
        run: node scripts/sanity-sync.mjs

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "Site already matches Sanity — nothing to commit."
            exit 0
          fi
          git config user.name "sanity-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.html'
          git commit -m "Update content from Sanity"
          git push
